add_newline = false
format = """[ ](bg:#333333)\
$conda\
$directory\
$fill\
$time\
$line_break\
$character"""

[directory]
truncate_to_repo = false
truncation_length = 0
format = "[$path ](bold cyan bg:#333333)"

[conda]
format = "[\\(](white bg:#333333)[$environment](bright-black bg:#333333)[\\) ](white bg:#333333)"
ignore_base = false

[fill]
symbol = " "

[time]
disabled = false
format = "[ $time ](green bg:#333333)"
time_format = "%H:%M:%S"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
