# Enable mouse support (tmux 2.1 and above)
set -g mouse on

# Set scrollback buffer to 10000
set -g history-limit 10000

# Reload tmux config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Toggle synchronize-panes with Ctrl+b then s
bind s setw synchronize-panes \; display-message "sync panes: #{?pane_synchronized,on,off}"

set-hook -g client-attached 'run-shell "tmux set-environment -g DISPLAY #{client_env(DISPLAY)}; tmux set-environment -g XAUTHORITY #{client_env(XAUTHORITY)}"'

# ── Appearance ──────────────────────────────────────────────

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pane borders
set -g pane-border-style "fg=colour245,bg=colour235"
set -g pane-active-border-style "fg=colour39,bg=colour234"
set -g pane-border-lines heavy

# Dim inactive panes
set -g window-style 'fg=colour247,bg=colour235'
set -g window-active-style 'fg=colour255,bg=colour234'

# Status bar
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[fg=colour16,bg=colour39,bold] #S #[fg=colour39,bg=colour235,nobold] "
set -g status-right "#[fg=colour248]#{?window_zoomed_flag,#[fg=colour214]● ZOOM ,}#{?pane_synchronized,#[fg=colour196]● SYNC ,}#[fg=colour245]%H:%M #[fg=colour39]%b %d "

# Window tabs
set -g window-status-format "#[fg=colour245] #I:#W "
set -g window-status-current-format "#[fg=colour39,bg=colour237,bold] #I:#W #[fg=colour237,bg=colour235]"
set -g window-status-separator ""

# Message styling
set -g message-style "fg=colour39,bg=colour235,bold"
set -g message-command-style "fg=colour39,bg=colour235"

# Clock
set -g clock-mode-colour colour39

# ── Plugins ─────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Continuum: auto-save every 15 minutes
set -g @continuum-save-interval '15'

# Resurrect: restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'